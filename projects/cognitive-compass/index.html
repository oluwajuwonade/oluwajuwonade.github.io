const bank=[
{id:'F1',d:'fluid',level:1,q:'What number completes the sequence?',v:'3, 7, 13, 21, 31, ?',o:['39','41','43','45'],a:2,e:'The differences are +4, +6, +8, +10. The next difference is +12, so 31 + 12 = 43.'},
{id:'F2',d:'fluid',level:2,q:'All Vens are Loras. No Loras are Pims. Which conclusion must follow?',o:['Some Vens are Pims','No Vens are Pims','All Pims are Vens','Some Loras are not Vens'],a:1,e:'Every Ven belongs to the Lora group, and the Lora and Pim groups do not overlap.'},
{id:'F3',d:'fluid',level:3,q:'A rule maps 2 → 6, 3 → 12, 4 → 20. What does it map 7 to?',o:['42','49','56','63'],a:2,e:'The mapping is n × (n + 1): 7 × 8 = 56.'},
{id:'F4',d:'fluid',level:2,q:'Which item is the best logical continuation? A, C, F, J, O, …',o:['S','T','U','V'],a:2,e:'The jumps are +2, +3, +4, +5, then +6. O plus six positions is U.'},
{id:'N1',d:'numeric',level:1,q:'A value of 240 increases by 15%. What is the new value?',o:['264','270','276','284'],a:2,e:'15% of 240 is 36. The new value is 240 + 36 = 276.'},
{id:'N2',d:'numeric',level:2,q:'A sum is divided in the ratio 2:3:5. If the total is 400, what is the largest share?',o:['120','160','180','200'],a:3,e:'There are 10 parts. Each part is 40, so the largest share is 5 × 40 = 200.'},
{id:'N3',d:'numeric',level:3,q:'A price is reduced by 20%, then the reduced price is increased by 20%. Relative to the original, the final price is…',o:['4% lower','unchanged','4% higher','8% lower'],a:0,e:'For an initial 100: 100 × 0.8 × 1.2 = 96. The final value is 4% lower.'},

{id:'V3',d:'verbal',level:3,q:'Which statement most clearly distinguishes correlation from causation?',o:['Two variables move together, so one causes the other','A relationship exists, but confounding or reverse causality may explain it','A large sample proves causation','A statistically significant result identifies the mechanism'],a:1,e:'Association alone does not establish causal direction or rule out confounding.'},
{id:'V4',d:'verbal',level:2,q:'Book is to author as symphony is to…',o:['Audience','Composer','Conductor’s baton','Concert hall'],a:1,e:'An author creates a book; a composer creates a symphony.'},
{id:'P1',d:'pattern',level:1,q:'What comes next?',v:'1, 4, 9, 16, 25, ?',o:['30','32','36','49'],a:2,e:'These are square numbers: 1² through 5². The next is 6² = 36.'},
{id:'P2',d:'pattern',level:2,q:'Which symbol completes the sequence?',v:'▲  ●  ▲▲  ●●  ▲▲▲  ?',o:['●','●●','●●●','▲▲▲▲'],a:2,e:'The shape alternates while the count increases by one: three triangles, then three circles.'},
{id:'P3',d:'pattern',level:3,q:'A sequence follows ×2, +3, ×2, +3. Starting at 4, what is the sixth term?',o:['35','38','50','53'],a:2,e:'4 → 8 → 11 → 22 → 25 → 50. The sixth term is 50.'},
{id:'P4',d:'pattern',level:2,q:'Which number is the odd one out?',v:'8, 27, 64, 100, 125',o:['8','27','100','125'],a:2,e:'8, 27, 64 and 125 are cubes (2³, 3³, 4³, 5³). 100 is not.'},
{id:'M1',d:'memory',level:1,q:'Study this sequence for five seconds, then choose its reverse.',v:'7 – 2 – 9 – 4 – 1',o:['1 – 4 – 9 – 2 – 7','1 – 9 – 4 – 2 – 7','4 – 1 – 9 – 2 – 7','1 – 4 – 2 – 9 – 7'],a:0,e:'Reversing the order gives 1 – 4 – 9 – 2 – 7.'},
{id:'M2',d:'memory',level:2,q:'A sequence is 4, 8, 1, 6, 3. What are the second and fourth digits added together?',o:['9','12','14','16'],a:2,e:'The second digit is 8 and the fourth is 6. Their sum is 14.'},
{id:'M3',d:'memory',level:3,q:'Remember the letters: K – R – B – T – M – A. Which letter was immediately before M?',o:['B','T','R','A'],a:1,e:'The sequence is K, R, B, T, M, A. T was immediately before M.'},
{id:'M4',d:'memory',level:2,q:'Starting with 5, 2, 8, 1, reverse the first two digits and then add the last two digits. What pair results?',o:['2, 5, 9','2, 5, 8, 1','5, 2, 9','2, 5, 1, 8'],a:0,e:'Reverse the first pair to 2, 5. The final pair totals 8 + 1 = 9.'},

{id:'S2',d:'speed',level:2,q:'Which code differs from the others by exactly one character?',v:'A8K2 · A8K2 · A8X2 · A8K2',o:['First','Second','Third','Fourth'],a:2,e:'The third code has X where the others have K.'},
{id:'S3',d:'speed',level:3,q:'Select the only ascending sequence.',o:['3 – 5 – 4 – 8','2 – 4 – 7 – 9','1 – 6 – 5 – 8','4 – 3 – 7 – 9'],a:1,e:'Only 2, 4, 7, 9 increases at every step.'},
{id:'S4',d:'speed',level:2,q:'How many times does the letter A appear?',v:'B A D C A F A G H A',o:['2','3','4','5'],a:2,e:'There are four As in the displayed sequence.'},
{id:'R1',d:'spatial',level:1,q:'An arrow rotates 90° clockwise at each step. What follows?',v:'↑  →  ↓  ?',o:['↗','←','↘','↑'],a:1,e:'A 90° clockwise rotation gives up, right, down, then left.'},
{id:'R2',d:'spatial',level:2,q:'A point moves clockwise around a square: top-left, top-right, bottom-right. Where next?',o:['Top-left','Bottom-left','Centre','Top-right'],a:1,e:'Continuing clockwise reaches the bottom-left corner.'},
{id:'R3',d:'spatial',level:3,q:'A cube is painted on every outside face and cut into 27 equal cubes. How many small cubes have paint on exactly two faces?',o:['8','12','16','20'],a:1,e:'The 12 edge-centre cubes have paint on exactly two faces.'},
{id:'R4',d:'spatial',level:2,q:'Which option is the left-right mirror image of “◀ ▲”?',o:['◀ ▲','▲ ▶','▶ ▲','▼ ▶'],a:1,e:'A left-right mirror reverses the order and flips left/right orientation: ▲ ▶.'},
{id:'C1',d:'critical',level:1,q:'A report says sales rose after a new advert launched. What is the strongest conclusion?',o:['The advert caused the rise','The advert and rise occurred in sequence; causation is not established','The advert had no effect','Sales would have fallen otherwise'],a:1,e:'Temporal order alone cannot establish causation. A comparison or stronger design is needed.'},
{id:'C2',d:'critical',level:2,q:'A survey of 20 volunteers at a gym is used to estimate exercise habits of all adults. The main concern is…',o:['Random measurement error only','Selection bias and poor representativeness','Too many observations','Reverse causality'],a:1,e:'Gym volunteers are a selected group and may differ systematically from the wider adult population.'},

{id:'C4',d:'critical',level:2,q:'A claim is supported by one small observational study. Which response is most defensible?',o:['Accept it as proven','Reject it automatically','Treat it as provisional and seek replication and alternative explanations','Assume the sample is representative'],a:2,e:'A single observational study can be informative but is not conclusive; replication and bias assessment matter.'}
];

function home(){const h=read(KEY,[]),last=h[0];$('#main').innerHTML=`
<section class="hero"><div><div class="eyebrow">A free cognitive development workspace</div><h1>Understand how you <span>think.</span><br>Build how you reason.</h1><p class="lead">Explore eight cognitive skill areas through original challenges, transparent performance feedback and practical exercises. Track your own progress without subscriptions or artificial limits.</p><div class="actions"><button class="btn primary" onclick="go('assessment')">Start the assessment →</button><button class="btn secondary" onclick="go('lab')">Explore the development lab</button></div><div class="proof"><span><b>✓</b>Always free</span><span><b>✓</b>No account required</span><span><b>✓</b>Results stored on this device</span></div></div><div class="orb"><div class="rings"><div class="core"><span>CC</span></div></div><div class="float f1">Reasoning<small>Patterns & logic</small></div><div class="float f2">Memory<small>Retain & manipulate</small></div><div class="float f3">Quantitative<small>Numbers & evidence</small></div><div class="float f4">Development<small>Practise & reflect</small></div></div></section>
<section class="section"><div class="sectionhead"><div><div class="eyebrow">Eight domains</div><h2>A broader view of cognitive performance.</h2></div><p>Each domain is explored through a small set of original tasks. Scores describe performance on this question set—not a complete measure of ability.</p></div><div class="grid">${domains.map((d,i)=>`<article class="card domain"><small>0${i+1} / COGNITIVE DOMAIN</small><h3>${d.name}</h3><p>${d.desc}</p></article>`).join('')}</div></section>
<div class="band"><strong>Scientific responsibility</strong><p>This is an educational self-assessment, not a clinically validated IQ test. There are no population percentiles, diagnoses or high-stakes recommendations. Item-level results are sensitive to practice, language, attention and testing conditions.</p></div>
<section class="section"><div class="sectionhead"><div><div class="eyebrow">Your workspace</div><h2>${last?'Continue your development.':'A complete learning loop.'}</h2></div><p>Assess, review, practise, and repeat. The core experience remains free.</p></div><div class="grid"><article class="card"><small class="tag">01 · ASSESS</small><h3>Adaptive assessment</h3><p>Difficulty adjusts within each domain based on your previous response.</p></article><article class="card"><small class="tag">02 · UNDERSTAND</small><h3>Performance dashboard</h3><p>See domain accuracy, relative strengths, development priorities and attempt history.</p></article><article class="card"><small class="tag">03 · PRACTISE</small><h3>Development laboratory</h3><p>Use focused exercises with immediate explanations and unlimited retries.</p></article><article class="card"><small class="tag">04 · REASSESS</small><h3>Track your progress</h3><p>Compare your own attempts over time while accounting for task familiarity.</p></article></div></section>
${last?`<section class="card"><div class="eyebrow">Latest local result</div><h2>${last.score}% raw accuracy</h2><p>${new Date(last.date).toLocaleString()} · ${last.correct}/24 correct</p><div class="actions"><button class="btn secondary" onclick="go('dashboard')">Open dashboard</button><button class="btn quiet" onclick="go('assessment')">New assessment</button></div></section>`:''}`;
}
function start(){state={answers:{},asked:[],idx:0,started:Date.now(),deadline:Date.now()+18*60*1000,level:Object.fromEntries(domains.map(d=>[d.id,2])),counts:Object.fromEntries(domains.map(d=>[d.id,0])),correct:Object.fromEntries(domains.map(d=>[d.id,0])),order:domains.map(d=>d.id),current:null};state.current=chooseNext();write(SESSION,state);go('assessment')}
function chooseNext(){const d=state.order.find(x=>state.counts[x]<3);if(!d)return null;const level=state.level[d];let pool=bank.filter(q=>q.d===d&&!state.asked.includes(q.id));pool.sort((a,b)=>Math.abs(a.level-level)-Math.abs(b.level-level));return pool[0]||null}
function assessment(){if(!state){$('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Baseline assessment · 24 items</div><h1>Map your current performance.</h1><p>Eight domains, three items per domain, approximately 15–18 minutes. Difficulty adapts between items based on your previous response. You can pause and resume on this device.</p></section><div class="grid"><article class="card"><h3>Scoring</h3><p>Each item is scored 0 or 1. Domain and overall percentages are raw accuracy only. Domains receive equal weight.</p></article><article class="card"><h3>Adaptive routing</h3><p>Correct answers raise the next target difficulty; incorrect answers lower it. The item pool is small and not psychometrically calibrated.</p></article><article class="card"><h3>Conditions</h3><p>Use a quiet setting. Avoid calculators for numerical items. Timing is descriptive, not a validated speed norm.</p></article></div><div class="actions"><button class="btn primary" onclick="start()">Begin assessment →</button></div><div class="notice"><b>Important:</b> This informal assessment is not an IQ test, clinical instrument or population norm. It must not be used for diagnosis, selection or other high-stakes decisions.</div>`;return}
if(!state.current)state.current=chooseNext();if(!state.current){finish();return}const q=state.current;const n=state.asked.length+1;const total=24;$('#main').innerHTML=`<div class="pagehead"><div class="eyebrow">Adaptive assessment · ${n} of ${total}</div><h1>Reasoning challenge.</h1><div class="progress"><i style="width:${n/total*100}%"></i></div></div><div class="assessment"><section class="card question"><div class="qtop"><span>ITEM ${String(n).padStart(2,'0')} / 24</span><span class="timer" id="timer">${timeleft()}</span></div><div class="qdomain">${domains.find(d=>d.id===q.d).name} · Target level ${q.level}</div><h2 class="prompt">${esc(q.q)}</h2>${q.v?`<div class="visual">${esc(q.v)}</div>`:''}<div class="answers">${q.o.map((v,i)=>`<button class="answer" data-a="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(v)}</button>`).join('')}</div><div class="qcontrols"><button class="btn quiet" onclick="quit()">Exit assessment</button><button class="btn primary" id="confirm" disabled>Submit answer →</button></div><p class="muted" style="font-size:10px;margin-top:14px">Answers are saved locally on this device. You cannot change a response after submitting an item.</p></section><aside class="sidebar"><article class="card"><h3>Domain coverage</h3>${domains.map(d=>`<div class="historyitem"><span>${d.name}</span><b>${state.counts[d.id]}/3</b></div>`).join('')}</article><article class="card"><h3>Adaptive difficulty</h3><p>Current target: level ${q.level}</p><p>Correct responses move the next target up; incorrect responses move it down.</p></article></aside></div>`;
let chosen=null;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('selected',x===b));$('#confirm').disabled=false});$('#confirm').onclick=()=>submit(chosen);if(tick)clearInterval(tick);tick=setInterval(()=>{const t=$('#timer');if(t)t.textContent=timeleft();if(Date.now()>=state.deadline)finish()},1000)}
function timeleft(){if(!state)return '00:00';const s=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function submit(choice){const q=state.current;if(!Number.isInteger(choice))return;const ok=choice===q.a;state.answers[q.id]={choice,correct:ok};state.asked.push(q.id);state.counts[q.d]++;if(ok){state.correct[q.d]++;state.level[q.d]=Math.min(3,state.level[q.d]+1)}else state.level[q.d]=Math.max(1,state.level[q.d]-1);state.current=chooseNext();write(SESSION,state);showFeedback(q,choice,ok)}
function showFeedback(q,choice,ok){const complete=state.asked.length===24||!state.current;$('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Response recorded · ${state.asked.length} of 24</div><h1>${ok?'Correct response.':'Review the reasoning.'}</h1><p>${domains.find(d=>d.id===q.d).name} · ${ok?'Your next item will target a higher difficulty where available.':'Your next item will target a lower difficulty where available.'}</p></section><section class="card"><h2>${esc(q.q)}</h2><div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(q.e)}</div><p style="margin-top:16px">Your answer: <b>${esc(q.o[choice])}</b> · Correct answer: <b>${esc(q.o[q.a])}</b></p><div class="actions"><button class="btn primary" onclick="continueAssessment()">${complete?'View my results':'Continue →'}</button></div></section>`;headerActive()}
function continueAssessment(){if(!state)return;if(state.asked.length===24||!state.current)finish();else assessment()}
function quit(){if(confirm('Exit and discard this assessment?')){state=null;localStorage.removeItem(SESSION);if(tick)clearInterval(tick);go('home')}}
function finish(){if(!state)return;const total=state.asked.length,correct=state.asked.filter(id=>state.answers[id]?.correct).length;const domainsOut={};domains.forEach(d=>{const n=state.counts[d.id],c=state.correct[d.id];domainsOut[d.id]={total:n,correct:c,score:n?Math.round(c/n*100):0}});const result={date:new Date().toISOString(),score:total?Math.round(correct/total*100):0,correct,total,domains:domainsOut,duration:Math.round((Date.now()-state.started)/1000),answers:state.answers};const history=read(KEY,[]);history.unshift(result);write(KEY,history.slice(0,30));state=null;localStorage.removeItem(SESSION);if(tick)clearInterval(tick);go('dashboard')}
function dashboard(){const h=read(KEY,[]),r=h[0];if(!r){$('#main').innerHTML=`<section class="empty"><div class="eyebrow">Performance dashboard</div><h1>Your baseline starts here.</h1><p>Complete an assessment to see your domain profile, relative strengths, development priorities and personal history.</p><button class="btn primary" onclick="go('assessment')">Start assessment</button></section>`;return}
const sorted=domains.map(d=>({...d,...r.domains[d.id]})).sort((a,b)=>b.score-a.score);const best=sorted[0],weak=sorted[sorted.length-1];const max=h.length>1?Math.max(...h.map(x=>x.score)):100;$('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Personal performance dashboard</div><h1>Your cognitive profile.</h1><p>Raw performance on Cognitive Compass tasks. This is a descriptive practice profile, not an IQ estimate or population ranking.</p></section><div class="stats"><article class="card stat"><strong>${r.score}%</strong><span>Overall raw accuracy</span></article><article class="card stat"><strong>${r.correct}/${r.total}</strong><span>Correct responses</span></article><article class="card stat"><strong>${Math.floor(r.duration/60)}m ${r.duration%60}s</strong><span>Completion time</span></article><article class="card stat"><strong>${h.length}</strong><span>Saved attempts on device</span></article></div><section class="card"><div class="sectionhead"><div><div class="eyebrow">Domain profile</div><h2>Performance by cognitive domain</h2></div><span class="tag">Equal domain weighting</span></div>${domains.map(d=>{const x=r.domains[d.id];return `<div class="domainrow"><span>${d.name}</span><div class="progress"><i style="width:${x.score}%"></i></div><strong>${x.score}%</strong></div>`}).join('')}</section><div class="grid" style="margin-top:13px"><article class="card"><div class="eyebrow">Relative strength</div><h2>${best.name}</h2><p>${best.score}% raw accuracy on ${best.total} items. This is the strongest domain in this attempt, not a stable trait estimate.</p></article><article class="card"><div class="eyebrow">Development priority</div><h2>${weak.name}</h2><p>${weak.score}% raw accuracy. Review the explanations and practise this domain before reassessing.</p></article><article class="card"><div class="eyebrow">Next step</div><h3>Targeted practice</h3><p>${weak.desc} Begin with focused exercises, then return to the assessment after a learning interval.</p><button class="btn secondary" onclick="go('lab')">Open lab</button></article><article class="card"><div class="eyebrow">Report</div><h3>Save your summary</h3><p>Print this dashboard or save it as a PDF from your browser.</p><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></article></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">Personal history</div><h2>Attempts over time</h2></div><button class="btn quiet" onclick="clearHistory()">Clear local history</button></div><div class="history">${h.map((x,i)=>`<div class="historyitem"><span>${new Date(x.date).toLocaleString()} · Attempt ${h.length-i}</span><b>${x.score}% <span>· ${x.correct}/${x.total}</span></b></div>`).join('')}</div><p style="font-size:10px">Repeated scores can reflect familiarity with the item pool as well as learning. Do not interpret small changes as a validated change in intelligence.</p></section>`;}
function clearHistory(){if(confirm('Delete all locally stored assessment history?')){localStorage.removeItem(KEY);dashboard()}}
function lab(){const item=activePractice?practice.find(x=>x.t===activePractice):null;if(item){$('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Development laboratory</div><h1>${item.t}.</h1><p>Try the exercise, then review the explanation. Repeats are unlimited.</p></section><section class="card"><h2>${item.q}</h2><div class="answers">${item.o.map((x,i)=>`<button class="answer" data-p="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(x)}</button>`).join('')}</div><div id="fb"></div><div class="actions"><button class="btn quiet" onclick="activePractice=null;lab()">Back to laboratory</button><button class="btn secondary" onclick="activePractice=null;lab()">Choose another</button></div></section>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-p]').forEach(x=>x.disabled=true);const ok=+b.dataset.p===item.a;b.classList.add('selected');$('#fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(item.e)}</div>`;if(ok&&!practiceDone.includes(item.t)){practiceDone.push(item.t);write(PRACT,practiceDone)}});return}
$('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Cognitive development laboratory</div><h1>Practise with intention.</h1><p>Short, original exercises build familiarity with useful reasoning strategies. Feedback explains the method; it does not promise a general increase in intelligence.</p></section><div class="stats"><article class="card stat"><strong>${practice.length}</strong><span>Free exercises</span></article><article class="card stat"><strong>${practiceDone.length}/${practice.length}</strong><span>Completed correctly</span></article><article class="card stat"><strong>∞</strong><span>Retries</span></article><article class="card stat"><strong>0</strong><span>Paywalls</span></article></div><div class="practicegrid">${practice.map(x=>`<article class="card"><div class="eyebrow">${domains.find(d=>d.id===x.d).name}</div><h3>${x.t}</h3><p>${x.q}</p><button class="btn secondary" onclick="activePractice='${x.t}';lab()">Open exercise →</button></article>`).join('')}</div><div class="notice"><b>Learning note:</b> Practice can improve familiarity and task-specific strategies. Transfer to broad cognitive abilities is a separate empirical question and is not guaranteed by these exercises.</div>`;}
function about(){ $('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Methodology & evidence</div><h1>Clarity over claims.</h1><p>Cognitive Compass is an independent educational platform for exploring performance on selected reasoning tasks.</p></section><section class="card"><h2>What is measured?</h2><p>Eight task categories: fluid reasoning, numerical reasoning, verbal reasoning, pattern recognition, working memory, processing speed, spatial reasoning and critical thinking. The item pool is original and authored for this product.</p><h2>Scoring</h2><p>Each item receives 1 point for the keyed answer and 0 otherwise. Overall raw accuracy is correct answers divided by attempted items. Domain accuracy is correct answers divided by attempted items in that domain. Domains are presented separately and receive equal weight in the descriptive overall score. There is no age adjustment, norm-referenced standardisation, percentile conversion or IQ transformation.</p><h2>Adaptive routing</h2><p>Each domain begins at target difficulty 2. A correct response raises the next target by one level; an incorrect response lowers it by one level, bounded between levels 1 and 3. The next unused item closest to that target is selected. The small item bank and difficulty labels are heuristic product logic, not calibrated item-response theory.</p><h2>Processing speed and timing</h2><p>Some tasks involve quick visual discrimination, and total elapsed time is recorded. The interface does not claim a standardised processing-speed measure. Device latency, reading speed, accessibility settings and interruptions affect timing.</p><h2>Interpretation limits</h2><p>This platform has not undergone representative norming, reliability studies, construct validation, criterion validation or independent psychometric review. Scores are not clinical findings, diagnoses, IQ scores, population percentiles or evidence of fixed ability. Do not use them for hiring, admissions, diagnosis or other high-stakes decisions.</p><h2>Practice and learning</h2><p>Exercises offer feedback on task strategies. Practice may improve familiarity with similar tasks; general transfer to intelligence or unrelated real-world outcomes is not established here.</p></section>`}
function privacy(){ $('#main').innerHTML=`<section class="pagehead"><div class="eyebrow">Privacy & data controls</div><h1>Your results stay on this device.</h1><p>The core experience does not require registration, email, payment or an external scoring API.</p></section><section class="card"><h2>Local storage</h2><p>Assessment history, an active session and practice completion are stored in this browser's local storage. They do not synchronise between devices and may be lost if browser data is cleared. Hosting providers may process standard request logs to serve the site.</p><h2>Delete your data</h2><p>Use the dashboard's “Clear local history” control, or clear this site's storage in your browser settings. Exiting an active assessment discards that attempt.</p><h2>No account security claims</h2><p>Because there is no account system, there are no user passwords or cloud profiles. Anyone with access to this browser profile may be able to view its locally stored results.</p><button class="btn quiet" onclick="localStorage.removeItem(KEY);localStorage.removeItem(SESSION);localStorage.removeItem(PRACT);state=null;practiceDone=[];alert('Cognitive Compass local data cleared.');go('home')">Clear all Cognitive Compass data</button></section>`}
function render(){if(tick){clearInterval(tick);tick=null}headerActive();const r=route();if(r==='home')home();else if(r==='assessment')assessment();else if(r==='dashboard')dashboard();else if(r==='lab')lab();else if(r==='about')about();else if(r==='privacy')privacy();else home()}
$('#menu').onclick=()=>$('#nav').classList.toggle('open');window.addEventListener('hashchange',render);window.addEventListener('beforeunload',()=>{if(state)write(SESSION,state)});render();
</script></body></html>
